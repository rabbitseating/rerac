plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxAccessToken = localProperties.getProperty('MAPBOX_ACCESS_TOKEN', '')
def openWeatherApiKey = localProperties.getProperty('OPENWEATHER_API_KEY', '')
def backendBaseUrl = localProperties.getProperty('BACKEND_BASE_URL', 'http://10.0.2.2:3000')

android {
    namespace 'com.example.mapbox'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.mapbox"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        resValue "string", "mapbox_access_token", mapboxAccessToken
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${openWeatherApiKey}\""
        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures{
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'org.json:json:20210307'
    implementation "com.squareup.okhttp3:okhttp:4.9.2"

    //Chart dependencies
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //Mapbox dependencies
    implementation 'com.mapbox.maps:android:10.14.1'
    implementation "com.mapbox.navigation:android:2.10.1"
    implementation "com.mapbox.navigation:ui-dropin:2.10.1"
    implementation "com.mapbox.search:place-autocomplete:1.0.0-rc.5"
    implementation "com.mapbox.search:mapbox-search-android-ui:1.0.0-rc.5"
}