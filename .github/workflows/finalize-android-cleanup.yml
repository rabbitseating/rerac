name: Finalize Android cleanup

on:
  push:
    branches: [portfolio-cleanup]
    paths:
      - ".github/workflows/finalize-android-cleanup.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final small fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("android-app/app/src/main/java/com/example/mapbox/TurnByTurnActivity.kt")
          text = path.read_text()

          text = text.replace("import com.github.mikephil.charting.interfaces.datasets.IBarDataSet\n", "")
          text = text.replace("import java.util.Date\n", "")
          text = text.replace("                // comment out the location engine setting block to disable simulation\n", "")
          text = text.replace("        // stop simulation\n\n", "")
          text = text.replace("            .withFillOpacity(0.2)\n            .withDraggable(false)", "            .withFillOpacity(0.0)\n            .withDraggable(false)", 1)
          text = text.replace("    private var userIsWithinGeofence = false\n", "")
          text = text.replace("                userIsWithinGeofence = false\n", "")
          text = text.replace("            userIsWithinGeofence = true\n", "")
          text = text.replace("        var id = \"0\"\n", "")
          text = re.sub(r"\n\s+id = ?\"(?:23|8|SIT|51|72|73)\"", "", text)

          old = '''                        geofenceRiskMap.putAll(risks)
                        geofenceTTCMap.putAll(ttc)
                        risk8Value = risks.getValue("Blk 8")
                        risk23Value = risks.getValue("Blk 23")
                        risk51Value = risks.getValue("Blk 51")
                        risk72Value = risks.getValue("Blk 72")
                        risk73Value = risks.getValue("Blk 73")
                        riskSITValue = risks.getValue("SIT")
                        runOnUiThread { updateAllRiskUi(); calculateDistance() }
'''
          new = '''                        runOnUiThread {
                            if (isFinishing || isDestroyed) return@runOnUiThread
                            geofenceRiskMap.putAll(risks)
                            geofenceTTCMap.putAll(ttc)
                            risk8Value = risks.getValue("Blk 8")
                            risk23Value = risks.getValue("Blk 23")
                            risk51Value = risks.getValue("Blk 51")
                            risk72Value = risks.getValue("Blk 72")
                            risk73Value = risks.getValue("Blk 73")
                            riskSITValue = risks.getValue("SIT")
                            updateAllRiskUi()
                            calculateDistance()
                        }
'''
          if old not in text:
              raise RuntimeError("Expected risk state update block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit final source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/example/mapbox/TurnByTurnActivity.kt
          git commit -m "Polish navigation activity state handling"
          git push origin portfolio-cleanup
