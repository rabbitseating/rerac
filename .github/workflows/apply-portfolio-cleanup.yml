name: Apply portfolio cleanup

on:
  push:
    branches:
      - portfolio-cleanup
    paths:
      - "scripts/apply_portfolio_cleanup.py"
      - ".github/workflows/apply-portfolio-cleanup.yml"

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source cleanup
        run: python scripts/apply_portfolio_cleanup.py
      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/example/mapbox/TurnByTurnActivity.kt
          git commit -m "Refactor navigation, geofencing, and chart loading"
          git push origin portfolio-cleanup
